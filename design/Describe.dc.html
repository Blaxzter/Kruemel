<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Kurz beschreiben</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&amp;family=Nunito:wght@500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#5B3FE0}a:hover{color:#4128B8}
button{-webkit-tap-highlight-color:transparent}
textarea::placeholder{color:#7A7396}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #8E88A6; color: #231F3A; font-family: Nunito, system-ui, sans-serif; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden">

  <section role="dialog" aria-labelledby="d-title" style="background: #F6F3FF; border-radius: 32px 32px 0 0; padding: 12px 20px 24px; display: flex; flex-direction: column; gap: 18px">
    <span aria-hidden="true" style="align-self: center; width: 44px; height: 5px; border-radius: 3px; background: #C9C2E3"></span>

    <div style="display: flex; align-items: center; gap: 14px">
      <div style="width: 56px; height: 56px; flex: none; border-radius: 18px; background: #FFD7B8; display: flex; align-items: center; justify-content: center">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#231F3A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h18c0 4.8-4 8-9 8s-9-3.2-9-8z"/><path d="M8.5 9c-.6-1 .6-2 0-3.5M12 9c-.6-1 .6-2 0-3.5M15.5 9c-.6-1 .6-2 0-3.5"/></svg>
      </div>
      <div style="display: flex; flex-direction: column; flex: 1">
        <h1 id="d-title" style="margin: 0; font-family: Fredoka, Nunito, sans-serif; font-weight: 600; font-size: 24px">Warmes Essen</h1>
        <span style="font-size: 14px; font-weight: 700; color: #5E5878">Gerade eben · 12:40</span>
      </div>
      <a href="Main.dc.html" aria-label="Schließen" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#231F3A" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </a>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="d-what" style="font-size: 13px; font-weight: 800; color: #5E5878">Was war es? <span style="font-weight: 600">(optional)</span></label>
      <textarea id="d-what" rows="2" placeholder="z. B. Nudeln mit Pesto" value="{{text}}" onChange="{{onText}}" style="box-sizing: border-box; width: 100%; border: 2px solid #D9D2F2; border-radius: 16px; padding: 12px 14px; font: 700 17px Nunito, sans-serif; color: #231F3A; background: #FFFFFF; resize: none; outline-color: #6B4EFF"></textarea>
      <span style="font-size: 12px; font-weight: 800; color: #5E5878; margin-top: 4px">Hattest du schon mal</span>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <sc-for list="{{recent}}" as="r" hint-placeholder-count="4">
          <button onClick="{{r.pick}}" style="height: 36px; padding: 0 14px; border: 0; border-radius: 999px; background: {{r.bg}}; color: {{r.fg}}; font: 700 14px Nunito, sans-serif; cursor: pointer">{{r.label}}</button>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span id="d-mood" style="font-size: 13px; font-weight: 800; color: #5E5878">Wie war es? <span style="font-weight: 600">(optional)</span></span>
      <div role="group" aria-labelledby="d-mood" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{moods}}" as="m" hint-placeholder-count="3">
          <button onClick="{{m.pick}}" aria-pressed="{{m.on}}" style="height: 72px; box-sizing: border-box; border: 2px solid {{m.border}}; border-radius: 18px; background: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font: 700 13px Nunito, sans-serif; color: #231F3A; cursor: pointer">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#231F3A" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="9" cy="10" r=".6" fill="#231F3A"/><circle cx="15" cy="10" r=".6" fill="#231F3A"/><path d="{{m.mouth}}"/></svg>
            <span>{{m.label}}</span>
          </button>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <a href="Main.dc.html" style="height: 56px; border-radius: 999px; background: #6B4EFF; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font: 800 17px Nunito, sans-serif; text-decoration: none">Speichern</a>
      <a href="Main.dc.html" style="height: 48px; display: flex; align-items: center; justify-content: center; font: 800 15px Nunito, sans-serif; text-decoration: none">Nur eintragen</a>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
var RECENT = ['Nudeln mit Pesto', 'Tomatensuppe', 'Reis mit Gemüse', 'Pizza von gestern'];
var MOODS = [
  { id: 'yum', label: 'Lecker', mouth: 'M8 14.5c1 1.6 2.4 2.4 4 2.4s3-.8 4-2.4' },
  { id: 'ok', label: 'Okay', mouth: 'M8.5 15.5h7' },
  { id: 'meh', label: 'Naja', mouth: 'M8 16.5c1-1.2 2.4-1.8 4-1.8s3 .6 4 1.8' }
];

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { text: '', mood: null };
  }

  renderVals() {
    var self = this;
    var s = this.state;
    return {
      text: s.text,
      onText: function (e) { self.setState({ text: e.target.value }); },
      recent: RECENT.map(function (label) {
        var on = s.text === label;
        return {
          label: label,
          bg: on ? '#231F3A' : '#FFFFFF',
          fg: on ? '#FFFFFF' : '#231F3A',
          pick: function () { self.setState({ text: label }); }
        };
      }),
      moods: MOODS.map(function (m) {
        var on = s.mood === m.id;
        return {
          label: m.label,
          mouth: m.mouth,
          on: on ? 'true' : 'false',
          border: on ? '#6B4EFF' : '#FFFFFF',
          pick: function () { self.setState({ mood: on ? null : m.id }); }
        };
      })
    };
  }
}
</script>
</body>
</html>
